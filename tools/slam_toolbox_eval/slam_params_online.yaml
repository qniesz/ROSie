# slam_toolbox params for ONLINE use on Pi Zero 2 W (416 MB RAM).
#
# Differences vs slam_params.yaml (offline eval):
#   * sync node (sync_slam_toolbox_node) — caller blocks per scan, no queue
#   * loop closure enabled with tight search space (4 m, chain=10)
#   * stack 8 MB (offline uses 10 MB; 8 MB fits within Pi Zero budget)
#   * scan buffer halved (20 → 10)
#   * correlation search trimmed
#   * minimum_travel 0.05 m / 0.05 rad (was 0.10/0.15) — more frequent corrections

slam_toolbox:
  ros__parameters:
    # ── Solver ─────────────────────────────────────────────────────────────
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
    ceres_num_threads: 2          # 4 → 2; halves per-thread scratch on Pi Zero

    # ── Sensor / scan matching ─────────────────────────────────────────────
    resolution: 0.10              # 0.05 → 0.10: quarters map RAM; 10 cm ok for ROSie footprint
    max_laser_range: 5.0
    minimum_time_interval: 0.2    # cap to ~5 Hz
    transform_timeout: 0.5
    tf_buffer_duration: 10.0      # 30 → 10 s (we don't need history)
    stack_size_to_use: 8000000    # 4 MB → 8 MB; needed now that loop closure is on

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.20      # raised: low value causes over-correction on featureless straight walls
    minimum_travel_heading: 0.15

    scan_buffer_size: 20                     # 10 → 20: larger anchor window for scan-matching in new rooms
    scan_buffer_maximum_scan_distance: 8.0

    # ── Correlation search ────────────────────────────────────────────────
    correlation_search_space_dimension: 0.35       # 0.3→0.5 caused lateral slide in featureless corridors; 0.35 balances multi-room recovery vs wall accuracy
    correlation_search_space_resolution: 0.05
    correlation_search_space_smear_deviation: 0.10

    # ── Loop closure DISABLED for online use ─────────────────────────────────
    # Enabling loop closure online with large search dimensions
    # (loop_search_space_dimension >= 6.0) causes slam_toolbox to crash with
    # "unable to get pointer in probability search" when the search window
    # extends beyond the partially-built map.  The sync node hits this harder
    # than async because there is no queue buffer to absorb the delay.
    # The offline slam_toolbox upgrade (rosie-slam-eval, run after the clean
    # cycle) handles loop closure on the complete trajectory with the full map
    # present — no risk of out-of-bounds search.
    # The primary multi-room fix is sync_slam_toolbox_node (no stale-odom queue).
    do_loop_closing: false
    loop_search_space_dimension: 4.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 15            # raised from 10: kept for safety
    loop_match_maximum_variance_coarse: 2.0      # raised from 3.0: kept for safety
    loop_match_minimum_response_coarse: 0.50     # raised from 0.35: kept for safety
    loop_match_minimum_response_fine: 0.60       # raised from 0.45: kept for safety

    # ── Map / mode ─────────────────────────────────────────────────────────
    map_update_interval: 5.0       # 30.0 → 5.0: publish /map every 5 s so Foxglove shows live progress
    enable_interactive_mode: false
    mode: mapping

    # ── Frames ─────────────────────────────────────────────────────────────
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_sim_time: false

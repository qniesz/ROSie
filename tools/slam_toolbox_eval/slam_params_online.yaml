# slam_toolbox params for ONLINE use on Pi Zero 2 W (416 MB RAM).
#
# Differences vs slam_params.yaml (offline eval):
#   * sync node (sync_slam_toolbox_node) — caller blocks per scan, no queue
#   * loop closure DISABLED — offline rosie-slam-eval handles this correctly;
#     live loop closure on Pi Zero 2 W produces bad closures after 15+ min
#   * minimum_travel 0.20 m / 0.30 rad — skip scan nodes during bump recovery
#     (reversal ~0.09 m, recovery turn ~45° — both below these thresholds)
#   * HuberLoss — downweights outlier scan matches instead of hard-accepting them

slam_toolbox:
  ros__parameters:
    # ── Solver ─────────────────────────────────────────────────────────────
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss    # downweight outlier scan matches (e.g. close-up wall during bump recovery)
    ceres_num_threads: 4          # all 4 cores; Armbian Orange Pi has 1.5 GB RAM

    # ── Sensor / scan matching ─────────────────────────────────────────────
    resolution: 0.10              # 0.05 → 0.10: quarters map RAM; 10 cm ok for ROSie footprint
    max_laser_range: 5.0
    minimum_time_interval: 0.2    # cap to ~5 Hz
    transform_timeout: 0.5
    tf_buffer_duration: 10.0      # 30 → 10 s (we don't need history)
    stack_size_to_use: 20000000   # 8 MB → 20 MB; more solver scratch space on 1.5 GB Pi

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.20      # 0.10 → 0.20: robot reversal is ~0.09m — skip nodes during bump recovery
    minimum_travel_heading: 0.30       # 0.15 → 0.30: bump turns are 40-55°; skip intermediate spin nodes

    scan_buffer_size: 30                     # 10 → 30; more retained scans improves matching on 1.5 GB Pi
    scan_buffer_maximum_scan_distance: 8.0

    # ── Correlation search ────────────────────────────────────────────────
    correlation_search_space_dimension: 0.40       # must be exact multiple of resolution (0.10); 0.30 too narrow → divergence/ghost maps; 0.35 caused OOB crash (not multiple); 0.50 caused lateral slide
    correlation_search_space_resolution: 0.02  # 0.05 → 0.02; finer search for better pose accuracy on 1.5 GB Pi
    correlation_search_space_smear_deviation: 0.10

    # ── Loop closure ENABLED for online use ──────────────────────────────────
    # Crashes seen previously were at loop_search_space_dimension >= 6.0 m;
    # Loop closure is handled offline by rosie-slam-eval after the clean cycle.
    # Enabling it live caused catastrophic map rotations at ~15-20 min when
    # scan-match quality degrades on the Pi Zero 2 W under load.
    do_loop_closing: false
    loop_search_space_dimension: 4.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 15            # raised from 10: kept for safety
    loop_match_maximum_variance_coarse: 2.0      # raised from 3.0: kept for safety
    loop_match_minimum_response_coarse: 0.50     # raised from 0.35: kept for safety
    loop_match_minimum_response_fine: 0.60       # raised from 0.45: kept for safety

    # ── Map / mode ─────────────────────────────────────────────────────────
    map_update_interval: 5.0       # 30.0 → 5.0: publish /map every 5 s so Foxglove shows live progress
    enable_interactive_mode: false
    mode: mapping

    # ── Frames ─────────────────────────────────────────────────────────────
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_sim_time: false

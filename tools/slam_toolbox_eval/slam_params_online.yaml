# slam_toolbox params for ONLINE use on Orange Pi Zero 2 W (1.5 GB RAM).
#
# Differences vs slam_params.yaml (offline eval):
#   * async node — queues scans for background processing
#   * loop closure ENABLED (4.0 m search space) — prevents disconnected-node
#     "new room" divergence caused by odom drift from bump-recovery pivots
#   * minimum_travel 0.10 m / 0.15 rad — denser scan graph for better closure
#   * HuberLoss — downweights outlier scan matches instead of hard-accepting them

slam_toolbox:
  ros__parameters:
    # ── Solver ─────────────────────────────────────────────────────────────
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss    # downweight outlier scan matches (e.g. close-up wall during bump recovery)
    ceres_num_threads: 4          # all 4 cores; Armbian Orange Pi has 1.5 GB RAM

    # ── Sensor / scan matching ─────────────────────────────────────────────
    resolution: 0.10              # 0.05 → 0.10: quarters map RAM; 10 cm ok for ROSie footprint
    max_laser_range: 5.0
    minimum_time_interval: 0.2    # cap to ~5 Hz
    transform_timeout: 0.5
    tf_buffer_duration: 10.0      # 30 → 10 s (we don't need history)
    stack_size_to_use: 20000000   # 8 MB → 20 MB; more solver scratch space on 1.5 GB Pi

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.05      # 0.10 → 0.05 (2026-05-25): match every 5 cm; faster error correction after wheel-spin stall
    minimum_travel_heading: 0.15       # 0.15: capture heading changes during bump-recovery turns

    scan_buffer_size: 30                     # 10 → 30; more retained scans improves matching on 1.5 GB Pi
    scan_buffer_maximum_scan_distance: 8.0

    # ── Correlation search ────────────────────────────────────────────────
    # History of dimension values (must stay exact multiple of search resolution 0.02 m):
    #   0.30 → too narrow: divergence/ghost maps
    #   0.35 → OOB crash (not a multiple of 0.02)
    #   0.40 → working but too narrow for wheel-spin recovery (±20 cm window)
    #   0.50 → lateral slide (false match on parallel wall — do NOT use)
    #   0.60 → current (2026-05-25): ±30 cm; recovers from table-stuck wheel-spin
    # Rationale: wheel spin under table → odom jumps 50+ cm; true pose outside ±20 cm → bad match.
    # Localization yaml uses 0.70 for same reason. Skip 0.50 (documented slide).
    correlation_search_space_dimension: 0.60       # 0.40 → 0.60 (2026-05-25): wider window for wheel-spin odom recovery; 0.60/0.02=30 ✓
    correlation_search_space_resolution: 0.02  # 0.05 → 0.02; finer search for better pose accuracy on 1.5 GB Pi
    correlation_search_space_smear_deviation: 0.15 # 0.10 → 0.15 (2026-05-25): wider Gaussian smear → larger basin of attraction when far from true pose

    # ── Loop closure ENABLED for online use ──────────────────────────────────
    #
    # History:
    #   Prior catastrophic rotation (2026-05-12) fired at ~14 min with:
    #     loop_match_minimum_response_coarse: 0.35 (old)
    #     loop_search_space_dimension: 6.0 (old)
    #   Thresholds have since been significantly tightened (coarse 0.60, fine
    #   0.70, space 2.0 m). The false angular match that caused rotation should
    #   now be REJECTED by these gates.
    #
    #   Root cause of ghosting with loop closure OFF: no loop closure = pure
    #   odometry-drift over 34-minute run. Same room visited twice appears
    #   offset. Online pass confirmed ZERO scan drops and ZERO errors — the
    #   drift is the only problem.
    #
    # ⚠ If map rotation returns: disable again and investigate Ceres firing
    #   pattern. Evidence will be in slam_online_out/slam.log (preprocessor.cc:67).
    do_loop_closing: true
    loop_search_space_dimension: 2.0            # 6.0 → 2.0: tight; avoids cross-room false matches
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 0.4      # slam_toolbox default; 2.0 was 5x too loose and caused false-closure explosions
    loop_match_minimum_response_coarse: 0.60     # raised from 0.50: stricter coarse gate
    loop_match_minimum_response_fine: 0.70       # raised from 0.60: stricter fine gate

    # ── Map / mode ─────────────────────────────────────────────────────────
    map_update_interval: 5.0       # 30.0 → 5.0: publish /map every 5 s so Foxglove shows live progress
    enable_interactive_mode: false
    mode: mapping

    # ── Frames ─────────────────────────────────────────────────────────────
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_sim_time: false

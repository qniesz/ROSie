# slam_toolbox params for LOCALIZATION mode on Pi Zero 2 W (416 MB RAM).
#
# Used when a saved posegraph exists at /slam_maps/rosie_home.posegraph.
# slam_toolbox loads the reference map and localizes the robot within it
# on every cleaning cycle — giving a consistent, drift-corrected map frame
# so no-go line coordinates are valid across runs.
#
# Key differences vs slam_params_online.yaml (mapping mode):
#   * mode: localization — does not grow the map, only corrects pose
#   * map_file_name — path to the serialized posegraph (no extension)
#   * map_start_at_dock: false — robot localizes from wherever it is
#   * map_update_interval: 0 — no grid publishing needed in localization
#   * correlation search slightly larger — better initial lock-on after undock

slam_toolbox:
  ros__parameters:
    # ── Solver ─────────────────────────────────────────────────────────────
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
    ceres_num_threads: 2

    # ── Sensor / scan matching ─────────────────────────────────────────────
    resolution: 0.10
    max_laser_range: 5.0
    # Pi Zero 2 W: slam_toolbox saturates a single core. Process scans at
    # ~2.5 Hz instead of 5 Hz to leave headroom; widen TF tolerance so late
    # scans aren't dropped by the message filter (was causing pose snaps).
    minimum_time_interval: 0.4
    transform_timeout: 1.0
    tf_buffer_duration: 30.0
    stack_size_to_use: 4000000

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.10   # raised from 0.05 to reduce CPU on Pi Zero
    minimum_travel_heading: 0.10    # raised from 0.05 to reduce CPU on Pi Zero

    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 8.0

    # ── Correlation search — slightly larger for better initial lock-on ───
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.05
    correlation_search_space_smear_deviation: 0.10

    # ── Loop closure — not needed in localization mode ────────────────────
    do_loop_closing: false
    loop_search_space_dimension: 4.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ── Map / mode ─────────────────────────────────────────────────────────
    map_update_interval: 10.0       # publish reference map every 10 s for Foxglove visibility
    enable_interactive_mode: false
    mode: localization

    # Path to the serialized posegraph (no file extension).
    # Must match SLAM_MAPS_DIR/SLAM_MAP_NAME in run_online.sh.
    map_file_name: /slam_maps/rosie_home

    # Suppress "Incorrect number of arguments for map starting pose" error.
    # Dock is always at the map origin (0, 0, 0); lifecycle_activate.py also
    # publishes /initialpose after activation to confirm this.
    map_start_pose: [0.0, 0.0, 0.0]

    # ── Frames ─────────────────────────────────────────────────────────────
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_sim_time: false

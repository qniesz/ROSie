# ROSie Map Card for Home Assistant
#
# Shows the live SLAM floor plan from the MQTT camera entity,
# vacuum status, pipeline status, and control buttons.
#
# During a Manual Map session the drive-map card allows clicking the
# map to navigate the robot to that point.  Press Return to Dock to
# drive back to (0, 0) and auto-save, or Finish Mapping to save in
# place.
#
# Setup:
#   1. Run scripts/ha_deploy.ps1 once — it copies ha/www/*.js to HA and
#      registers them as Lovelace JS Module resources automatically.
#      Requires HA_SAMBA_HOST, HA_SAMBA_USER, HA_SAMBA_PASS, HA_URL, and
#      HA_TOKEN in your .env file.
#
#   2. Add this card YAML to a Lovelace dashboard, then hard-refresh
#      the browser (Ctrl+Shift+R) so the new JS modules are picked up.

type: vertical-stack
cards:
  # Drive map — click to navigate during a Manual Map session
  - type: custom:rosie-drive-map-card
    camera_entity: camera.rosie_rosie_map

  # Vacuum status + battery + pipeline
  - type: entities
    entities:
      - entity: vacuum.rosie
        name: Status
      - type: attribute
        entity: vacuum.rosie
        attribute: battery_level
        name: Battery
        icon: mdi:battery
        suffix: "%"
      - entity: sensor.rosie_map_pipeline
        name: Map Pipeline
        icon: mdi:map-clock

  # Control buttons — row 1: cleaning + map mode selection
  - type: horizontal-stack
    cards:
      - type: button
        name: Start
        icon: mdi:play
        tap_action:
          action: perform-action
          perform_action: vacuum.start
          target:
            entity_id: vacuum.rosie
      - type: button
        name: Dock
        icon: mdi:home
        tap_action:
          action: perform-action
          perform_action: vacuum.return_to_base
          target:
            entity_id: vacuum.rosie
      - type: button
        name: Stop
        icon: mdi:stop
        tap_action:
          action: perform-action
          perform_action: vacuum.stop
          target:
            entity_id: vacuum.rosie
      - type: button
        entity: button.rosie_create_map_auto
        name: Auto Map
        icon: mdi:map-plus
        show_state: false
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.rosie_create_map_auto
      - type: button
        entity: button.rosie_create_map_manual
        name: Manual Map
        icon: mdi:map-marker-path
        show_state: false
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.rosie_create_map_manual

  # Row 2: Return to Dock (navigate to 0,0 + auto-save) | Finish Mapping (save in place)
  - type: horizontal-stack
    cards:
      - type: button
        name: Return to Dock
        icon: mdi:home-import-outline
        tap_action:
          action: perform-action
          perform_action: vacuum.return_to_base
          target:
            entity_id: vacuum.rosie
      - type: button
        entity: button.rosie_finish_map
        name: Finish Mapping
        icon: mdi:map-check
        show_state: false
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.rosie_finish_map


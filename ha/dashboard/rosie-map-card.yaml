# ROSie Map Card for Home Assistant
#
# Shows the live SLAM floor plan from the MQTT camera entity,
# vacuum status, pipeline status, and control buttons.
#
# Setup:
#   1. The rosie server container auto-registers these entities via
#      MQTT Discovery:
#        - camera.rosie_map           (floor plan image, entity ID may be camera.rosie_rosie_map)
#        - button.rosie_create_new_map (triggers map pipeline)
#        - sensor.rosie_map_pipeline  (pipeline status)
#
#   2. Add this card YAML to a Lovelace dashboard
#      (Edit dashboard → Add Card → Manual YAML → paste this).
#
#   3. For the no-go editor card, register the JS resource:
#        Settings → Dashboards → Resources → Add:
#        URL: /local/rosie-nogo-editor-card.js
#        Type: JavaScript Module
#      Copy ha/www/rosie-nogo-editor-card.js to your HA's
#      config/www/ directory.

type: vertical-stack
cards:
  # Map image from MQTT camera (auto-updates after each pipeline run)
  - type: picture-entity
    entity: camera.rosie_rosie_map
    name: ROSie Floor Plan
    show_state: false
    show_name: true
    camera_view: auto

  # Vacuum status + battery + pipeline
  - type: entities
    entities:
      - entity: vacuum.rosie
        name: Status
      - type: attribute
        entity: vacuum.rosie
        attribute: battery_level
        name: Battery
        icon: mdi:battery
        suffix: "%"
      - entity: sensor.rosie_map_pipeline
        name: Map Pipeline
        icon: mdi:map-clock

  # Control buttons
  - type: horizontal-stack
    cards:
      - type: button
        name: Start
        icon: mdi:play
        tap_action:
          action: call-service
          service: vacuum.start
          target:
            entity_id: vacuum.rosie
      - type: button
        name: Dock
        icon: mdi:home
        tap_action:
          action: call-service
          service: vacuum.return_to_base
          target:
            entity_id: vacuum.rosie
      - type: button
        name: Stop
        icon: mdi:stop
        tap_action:
          action: call-service
          service: vacuum.stop
          target:
            entity_id: vacuum.rosie
      - type: button
        name: New Map
        icon: mdi:map-plus
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.rosie_create_new_map

  # No-go line editor (click-to-draw on the map)
  - type: custom:rosie-nogo-editor-card
    camera_entity: camera.rosie_rosie_map
